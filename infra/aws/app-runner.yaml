version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install --workspace=server
      - cd server && npx prisma generate && npx prisma db push && npm run build
run:
  command: cd server && npm start
  network:
    port: 5001
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "5001"
    - name: CORS_ORIGIN
      value: "*"
    - name: DATABASE_URL
      value: "file:./dev.db"
    - name: RATE_LIMIT_MAX
      value: "200"
