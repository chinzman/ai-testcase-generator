services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: esperia-ai-qa-server
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - DATABASE_URL=file:/app/server/prisma/dev.db
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RATE_LIMIT_MAX=150
    volumes:
      - db_data:/app/server/prisma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: esperia-ai-qa-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  db_data:
    driver: local
