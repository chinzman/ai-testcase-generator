services:
  # Backend API Web Service
  - type: web
    name: ai-testcase-generator-api
    runtime: node
    plan: free
    buildCommand: npm install --workspace=server && cd server && npx prisma generate && npx prisma db push && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: LLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/healthz

  # Frontend Static Site
  - type: web
    name: ai-testcase-generator-ui
    runtime: static
    plan: free
    buildCommand: npm install --workspace=client && cd client && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-testcase-generator-api
          property: host
