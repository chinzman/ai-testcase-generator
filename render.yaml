services:
  - type: web
    name: ai-testcase-generator
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && cd server && npx prisma generate && npx prisma db push && cd .. && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: LLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/healthz
